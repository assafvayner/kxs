[package]
name = "kxs-core"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
thiserror = "2"
tempfile = "3"
dirs = "6"

[dev-dependencies]
serde_json = "1"
