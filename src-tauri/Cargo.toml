[package]
name = "kxs"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
kxs-core = { path = "../crates/kxs-core" }
kxs-cluster = { path = "../crates/kxs-cluster" }
tokio = { version = "1", features = ["sync", "time"] }
base64 = "0.22"
